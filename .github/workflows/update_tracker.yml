name: Update Movie Tracker

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: ["main"]
    paths:
      - "watchlist.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IMDb and Douban tracker
        run: |
          python -m src.tracker
          python -m src.render_mobile

      - name: Commit and push updated tracker data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json TRACKER.md README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update movie tracker"
            git push
          fi
